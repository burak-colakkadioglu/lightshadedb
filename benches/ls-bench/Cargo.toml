[package]
name = "ls-bench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["host", "client"]
host = ["embedded", "lightshadedb/host"]
client = ["lightshadedb/client"]
embedded = []
async = ["lightshadedb/async"]

[[bin]]
name = "ls-bench"
path = "src/main.rs"

[dependencies]
lightshadedb = { path = "../.." }
postgres = "0.19"
postgresql_embedded = { version = "0.22", features = ["blocking", "tokio"] }
redb = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
tempfile = { workspace = true }
fjall = "3"
heed = "0.23"
libsql = { version = "0.10", default-features = false, features = ["core"] }
mysql = "28"
redis = "0.32"
tokio = { version = "1", features = ["rt"] }
