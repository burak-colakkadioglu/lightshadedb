[workspace]
resolver = "2"
members = [
    ".",
    "codegen",
    "macros",
    "benches/ls-bench",
    "examples/rust-messages",
    "examples/rust-suite",
]

[workspace.package]
version = "2.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/burak-colakkadioglu/lightshadedb"

[workspace.dependencies]
lightshadedb = { path = ".", version = "2.1.1" }
lightshadedb-codegen = { path = "codegen", version = "2.1.1" }
lightshadedb-macros = { path = "macros", version = "2.1.1" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
thiserror = "2.0.21"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["derive"] }
tempfile = "3"
trybuild = "1"
toml = "1"

[package]
name = "lightshadedb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightshade DB: Rust-native schema, specialized queries, embedded and connected deployment."

[lib]
path = "src/lib.rs"

[[bin]]
name = "lightshade"
path = "src/bin/lightshade/main.rs"

[dependencies]
lightshadedb-macros = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
lightshadedb-codegen = { workspace = true }
tokio = { version = "1", optional = true, features = ["net", "time", "sync", "fs", "io-util"] }

[features]
default = ["embedded"]
embedded = []
host = ["embedded"]
client = []
async = ["dep:tokio"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
