[package]
name = "rust-suite"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lightshadedb = { workspace = true }

[features]
default = ["embedded"]
embedded = ["lightshadedb/embedded"]
host = ["embedded", "lightshadedb/host"]
client = ["lightshadedb/client"]
async = ["lightshadedb/async"]

[dev-dependencies]
lightshadedb-codegen = { workspace = true }
