[package]
name = "rust-messages"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lightshade = { path = "../.." }

[features]
default = ["embedded"]
embedded = ["lightshade/embedded"]
host = ["embedded", "lightshade/host"]
client = ["lightshade/client"]
async = ["lightshade/async"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
