[package]
name = "rust-messages"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lightshadedb = { path = "../.." }

[features]
default = ["embedded"]
embedded = ["lightshadedb/embedded"]
host = ["embedded", "lightshadedb/host"]
client = ["lightshadedb/client"]
async = ["lightshadedb/async"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
