[program:lightshade-messages]
command=/usr/local/bin/lightshade serve /srv/lightshade/messages.lightshade /srv/lightshade/messages.lsdb
directory=/srv/lightshade
user=lightshade
autostart=true
autorestart=unexpected
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=LIGHTSHADE_CREDENTIALS="/etc/lightshade/messages.credentials",LIGHTSHADE_AUDIT_LOG="/var/log/lightshade/messages.audit.jsonl",LIGHTSHADE_MAX_CONNECTIONS="128",LIGHTSHADE_SHUTDOWN_TIMEOUT_MS="10000"
stdout_logfile=/var/log/lightshade/messages.log
redirect_stderr=true
