name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per engine
        default: "5000"
        type: string
      engines:
        description: Engines to run
        default: all
        type: choice
        options: [all, lightshade, lightshade-client, lightshade-client-x16, redb, sqlite, postgres, mysql, cockroachdb]
      threads:
        description: Client threads for lightshade-client-x16
        default: "16"
        type: string
      oses:
        description: Operating systems to run on
        default: all
        type: choice
        options: [all, linux, windows, macos]

run-name: bench rows=${{ inputs.rows }} engines=${{ inputs.engines }} oses=${{ inputs.oses }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.set.outputs.engines }}
      oses: ${{ steps.set.outputs.oses }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.engines }}" = "all" ]; then
            echo 'engines=["lightshade", "lightshade-client", "lightshade-client-x16", "redb", "sqlite", "postgres", "mysql", "cockroachdb"]' >> "$GITHUB_OUTPUT"
          else
            echo 'engines=["${{ inputs.engines }}"]' >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.oses }}" = "all" ]; then
            echo 'oses=["ubuntu-latest", "windows-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.oses }}" = "linux" ]; then
            echo 'oses=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.oses }}" = "windows" ]; then
            echo 'oses=["windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'oses=["macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.engine }})
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
        engine: ${{ fromJSON(needs.setup.outputs.engines) }}
        exclude:
          # mysql only runs on Linux (no Windows/macOS provisioning)
          - os: windows-latest
            engine: mysql
          - os: macos-latest
            engine: mysql
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: bench
          MYSQL_DATABASE: benchdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbench"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Cache PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.theseus/postgresql
          key: pgbin-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pgbin-${{ matrix.os }}-
      - name: Cache CockroachDB binary
        id: crdb-cache
        if: ${{ inputs.engines == 'all' || inputs.engines == 'cockroachdb' }}
        uses: actions/cache@v4
        with:
          path: crdb-bin
          key: crdb-v25.2.1-${{ matrix.os }}
      - name: Download CockroachDB
        if: ${{ (inputs.engines == 'all' || inputs.engines == 'cockroachdb') && steps.crdb-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p crdb-bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -sL -o crdb.zip https://binaries.cockroachdb.com/cockroach-v25.2.1.windows-6.2-amd64.zip
            unzip -q -o crdb.zip -d crdb-dl
            cp crdb-dl/cockroach-v25.2.1.windows-6.2-amd64/cockroach.exe crdb-bin/
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            curl -sL -o crdb.tgz https://binaries.cockroachdb.com/cockroach-v25.2.1.darwin-10.9-arm64.tgz
            tar xzf crdb.tgz -C crdb-dl 2>/dev/null || (mkdir -p crdb-dl && tar xzf crdb.tgz -C crdb-dl)
            cp crdb-dl/cockroach-v25.2.1.darwin-10.9-arm64/cockroach crdb-bin/
          else
            curl -sL -o crdb.tgz https://binaries.cockroachdb.com/cockroach-v25.2.1.linux-amd64.tgz
            mkdir -p crdb-dl && tar xzf crdb.tgz -C crdb-dl
            cp crdb-dl/cockroach-v25.2.1.linux-amd64/cockroach crdb-bin/
          fi
      - name: Start CockroachDB
        if: ${{ inputs.engines == 'all' || inputs.engines == 'cockroachdb' }}
        shell: bash
        run: |
          BIN=crdb-bin/cockroach
          [ "${{ matrix.os }}" = "windows-latest" ] && BIN=crdb-bin/cockroach.exe
          chmod +x "$BIN" 2>/dev/null || true
          mkdir -p cr-store
          "$BIN" start-single-node --insecure --listen-addr=127.0.0.1:26257 --store=cr-store --background
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Build benchmark
        run: cargo build --release -p ls-bench
      - name: Run benchmark
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LS_BENCH_THREADS: ${{ inputs.threads }}
        run: |
          if [ "${{ matrix.engine }}" = "cockroachdb" ]; then
            export COCKROACH_STORE=cr-store
          fi
          BIN=target/release/ls-bench
          OUT="results-${{ matrix.os }}-${{ matrix.engine }}.json"
          "$BIN" --engine "${{ matrix.engine }}" --rows "${{ inputs.rows }}" --out "$OUT"
          mkdir -p results
          mv "$OUT" results/
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.engine }}
          path: results/
          retention-days: 90

  report:
    name: report
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Versions
        id: versions
        run: |
          echo "rustc=$(rustc -V)" >> "$GITHUB_OUTPUT"
          echo "lightshade=$(grep '^version' Cargo.toml | head -1 | awk -F'\"' '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "redb=$(cargo tree -p redb --depth 0 --prefix none 2>/dev/null | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "rusqlite=$(cargo tree -p rusqlite --depth 0 --prefix none 2>/dev/null | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sysinfo=$(cargo tree -p sysinfo --depth 0 --prefix none 2>/dev/null | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Render report
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import glob, json, os, sys
          from datetime import datetime, timezone
          out = sys.argv[1]
          rows = sorted(
              (json.load(open(f)) for f in glob.glob("results/*.json")),
              key=lambda d: (d["os"], d["engine"]),
          )
          engines = ["lightshade", "lightshade-client", "lightshade-client-x16", "redb", "sqlite", "postgres", "mysql", "cockroachdb"]
          present = sorted({d["engine"] for d in rows if d["engine"] in engines},
                           key=engines.index)
          workloads = ["insert", "get", "scan", "count", "batch", "churn"]
          notes = {
              "lightshade": "defaults (8 MiB checkpoints, 1 ms group commit); planner index on (inbox_id, is_read, sent_at)",
              "lightshade-client": "same engine over TCP localhost (sequential; RTT-bound)",
              "lightshade-client-x16": "16 sharded blocking clients over TCP localhost (server parallelizes reads under RwLock, applies writes serially, group-commits WAL fsyncs across connections; measures connection scaling)",
              "redb": "one write txn per insert; no secondary index (full scan + sort in harness)",
              "sqlite": "autocommit per op, stock journal mode/synchronous; index on (inbox_id, is_read, sent_at DESC)",
              "postgres": "autocommit per op over TCP localhost; stock settings; index on (inbox_id, is_read, sent_at DESC)",
              "mysql": "MySQL 8 service, autocommit per op; index on (inbox_id, is_read, sent_at DESC)",
              "cockroachdb": "single-node cluster over postgres wire protocol; storage measured as store-dir delta (LSM flush timing makes small runs approximate)",
          }
          versions = {
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              "rustc": os.environ.get("RUSTC_V", ""),
              "lightshade": os.environ.get("LS_V", ""),
              "redb": os.environ.get("REDB_V", ""),
              "rusqlite": os.environ.get("SQLITE_V", ""),
              "sysinfo": os.environ.get("SYSINFO_V", ""),
              "rows": str(rows[0]["rows"]) if rows else "?",
          }
          L = []
          L.append("# Benchmarks")
          L.append("")
          L.append("| key | value |")
          L.append("|---|---|")
          for k in ["date", "rustc", "lightshade", "redb", "rusqlite", "sysinfo", "rows"]:
              L.append(f"| {k} | {versions[k]} |")
          L.append("| batch | 100 rows per op |")
          for e in present:
              L.append(f"| {e} | {notes.get(e, '')} |")
          for os_name in ["linux", "windows", "macos"]:
              group = [d for d in rows if d["os"] == os_name]
              if not group:
                  continue
              by_engine = {d["engine"]: d for d in group}
              present_os = [e for e in present if e in by_engine]
              if not present_os:
                  continue
              cpu = next((d["cpu"] for d in group if d.get("cpu")), "")
              L.append("")
              L.append(f"## {os_name} ({cpu}, {group[0]['cpus']} cpus, {group[0]['mem_mb']} MiB RAM)")
              L.append("")
              L.append("| workload | " + " | ".join(present_os) + " |")
              L.append("|---|" + "---|" * len(present_os))
              for w in workloads:
                  cells = []
                  for e in present_os:
                      p = by_engine[e]["phases"].get(w)
                      cells.append(f"{p['ops_s']:,.0f} ops/s" if p else "n/a")
                  L.append(f"| {w} | " + " | ".join(cells) + " |")
              L.append("")
              L.append("| workload | " + " | ".join(present_os) + " |")
              L.append("|---|" + "---|" * len(present_os))
              for w in workloads:
                  cells = []
                  for e in present_os:
                      p = by_engine[e]["phases"].get(w)
                      cells.append(f"{p['p50_us']:,.1f} / {p['p99_us']:,.1f} us" if p else "n/a")
                  L.append(f"| {w} p50 / p99 | " + " | ".join(cells) + " |")
              L.append("")
              L.append("| engine | peak RSS (MiB) | peak cpu % |")
              L.append("|---|---|---|")
              for e in present_os:
                  d = by_engine[e]
                  L.append(f"| {e} | {d['peak_rss_mb']:.1f} | {d['cpu_pct']:.1f} |")
              stored = [(e, by_engine[e].get("storage")) for e in present_os]
              stored = [(e, s) for e, s in stored if isinstance(s, dict)]
              if stored:
                  logical = stored[0][1]["logical_bytes"]
                  L.append("")
                  L.append(f"| storage ({rows[0]['rows']} mixed rows, logical {logical / 1024 / 1024:.1f} MiB) | bytes/row | amplification | after-reclaim bytes/row |")
                  L.append("|---|---|---|---|")
                  for e, s in stored:
                      per_row = s["disk_bytes"] / s["rows"] if s["rows"] else 0
                      amp = s["disk_bytes"] / s["logical_bytes"] if s["logical_bytes"] else 0
                      reclaimed = s["compacted_bytes"] / s["rows"] if s["rows"] else 0
                      L.append(f"| {e} | {per_row:,.0f} | {amp:.2f}x | {reclaimed:,.0f} |")
              reopened = [(e, by_engine[e].get("reopen")) for e in present_os]
              reopened = [(e, r) for e, r in reopened if isinstance(r, dict)]
              if reopened:
                  L.append("")
                  L.append("| reopen | open ms | cold point-get us |")
                  L.append("|---|---|---|")
                  for e, r in reopened:
                      L.append(f"| {e} | {r['open_ms']:.1f} | {r['cold_get_us']:.1f} |")
          report = "\n".join(L) + "\n"
          open("report.md", "w").write(report)
          open(out, "a").write(report + "\n")
          print(report)
          PYEOF
        env:
          RUSTC_V: ${{ steps.versions.outputs.rustc }}
          LS_V: ${{ steps.versions.outputs.lightshade }}
          REDB_V: ${{ steps.versions.outputs.redb }}
          SQLITE_V: ${{ steps.versions.outputs.rusqlite }}
          SYSINFO_V: ${{ steps.versions.outputs.sysinfo }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            report.md
            results/
          retention-days: 90
